name: flutter_drug_search
description: Egyptian drug search — merged karem505 + MoaazSalter SQLite (33 categories, Arabic names, EGP prices).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # sqflite_ffi: open the prebuilt SQLite DB on desktop (Linux/Windows/macOS)
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.4+4
  path_provider: ^2.1.6
  path: ^1.9.0
  provider: ^6.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/egypt_drugs.db
