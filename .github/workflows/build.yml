name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
      - run: flutter pub get
      - run: flutter test
      - run: flutter build linux --release
      - name: Zip Linux bundle
        run: |
          cd build/linux/x64/release/bundle
          zip -r ../../../../../egypt-drug-search-linux.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: egypt-drug-search-linux.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter test
      - run: flutter build windows --release
      - name: Zip Windows bundle
        run: |
          cd build/windows/x64/runner/Release
          Compress-Archive -Path * -DestinationPath ../../../../../egypt-drug-search-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: egypt-drug-search-windows.zip

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Egyptian Drug Search v1.0.${{ github.run_number }}
          files: |
            artifacts/linux-release/egypt-drug-search-linux.zip
            artifacts/windows-release/egypt-drug-search-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
